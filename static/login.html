<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispatcher login | Food Relief Dispatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
  <style>
    :root { --ink: #1c2b33; --paper: #eef2f0; --line: #c9d3d0; --blue: #1f5fad; --red: #c8323c; --muted: #55656d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
           background: var(--ink); color: var(--ink); font: 17px/1.5 "Barlow", system-ui, sans-serif; }
    form { background: var(--paper); border-radius: 8px; padding: 28px; width: 100%; max-width: 360px; }
    h1 { font: 600 28px/1.1 "Barlow Semi Condensed", "Arial Narrow", sans-serif; margin: 0 0 4px; }
    p { margin: 0 0 18px; color: var(--muted); }
    label { display: block; font-weight: 500; margin-bottom: 6px; }
    input { width: 100%; font: 17px inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 5px; }
    button { width: 100%; margin-top: 14px; font: 600 18px/1 "Barlow Semi Condensed", sans-serif;
             padding: 13px; border: 0; border-radius: 5px; background: var(--blue); color: #fff; cursor: pointer; }
    button:hover { background: #2a6dc0; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
    .error { color: var(--red); margin: 10px 0 0; min-height: 1.5em; }
    a { color: var(--blue); }
  </style>
</head>
<body>
  <form id="login">
    <h1>Dispatcher console</h1>
    <p>For dispatch staff. Looking to request food? <a href="/">Go to the request page</a>.</p>
    <label for="username">Username</label>
    <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password" style="margin-top:12px">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <p id="error" class="error" role="alert"></p>
  </form>
  <script>
    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      if (res.ok) { location.reload(); return; }
      const error = document.getElementById("error");
      if (res.status === 429) {
        error.textContent = (await res.json()).detail;
      } else {
        error.textContent = "That username or password isn't right. Try again.";
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
      }
    });
  </script>
</body>
</html>
